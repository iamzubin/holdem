[package]
name = "holdem"
version = "3.1.1"
description = "A Tauri App"
authors = ["Zubin"]
edition = "2021"


[lib]
name = "holdem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-shell = "2.5.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2.7.1"
chrono = "0.4.45"
base64 = "0.23.1"
tauri-plugin-process = "2.4.0"
drag = { path = "drag-patch" }
image = "0.25.10"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
posthog-rs = { version = "0.27.0", default-features = false, features = ["async-client"] }
tokio = "1.53.3"
uuid = { version = "1.28.0", features = ["v4"] }
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
url = "2"
windows-core = "0.62.2"

windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com_StructuredStorage",
    "Win32_Security",
    "Win32_System_SystemServices",
] }

[profile.release]
lto = true
