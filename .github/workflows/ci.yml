name: ci

# Build and test checks for pull requests and pushes to the main branches.
# The desktop app is Windows-only, so it builds on windows-latest.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Desktop app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # Type-checks and builds the frontend. It must run before cargo:
      # tauri::generate_context! embeds app/dist at compile time.
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: cargo clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: holdem_website
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: holdem_website/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: holdem_website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
