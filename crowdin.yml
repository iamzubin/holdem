# Crowdin configuration for Holdem (https://github.com/iamzubin/holdem/issues/47)
# Source language: English
# Docs: https://crowdin.com/documentation/config-file
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
preserve_hierarchy: true

files:
  - source: /app/src/i18n/locales/en.json
    translation: /app/src/i18n/locales/%two_letters_code%.json
    multilingual: false
